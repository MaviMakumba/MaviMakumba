<polygon points="18,1 589,1 589,402 572,419 1,419 1,18" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-dasharray="160 840" filter="url(#g)"
 style="animation:run 9s linear infinite"/><text x="28" y="40" class="mono" font-size="11.5" letter-spacing="2" fill="#ff8a3d">MISSION 03 // BIG DATA · BSM 461</text><rect x="421" y="22" width="145" height="24" rx="12" fill="#ffc06b" fill-opacity=".1" stroke="#ffc06b" stroke-opacity=".7"/><circle cx="434" cy="34" r="4" fill="#ffc06b" filter="url(#g)" style="animation:blink 1.4s steps(1) infinite"/><text x="445" y="38.5" class="mono" font-size="12" font-weight="700" letter-spacing="1" fill="#ffc06b">IN DEVELOPMENT</text><text x="26" y="88" class="sans" font-size="31" font-weight="800" fill="#f3e9ff" filter="url(#g)">Real-Time IoT Anomaly Pipeline</text><text x="28" y="114" class="sans" font-size="15" fill="#ff2a6d">Streaming analytics for a 200-sensor network</text><text x="28" y="150" class="sans" font-size="14.5" fill="#ddd0f2"><tspan fill="#ff2a6d">▸ </tspan>Designed for 2,000 events/s sustained and 2× peak load.</text><text x="28" y="175" class="sans" font-size="14.5" fill="#ddd0f2"><tspan fill="#ff2a6d">▸ </tspan>Goal: flag anomalous sensors within 5 seconds of the event.</text><text x="28" y="200" class="sans" font-size="14.5" fill="#ddd0f2"><tspan fill="#ff2a6d">▸ </tspan>Resilient to 15% late data, duplicates and dirty records.</text><text x="28" y="225" class="sans" font-size="14.5" fill="#ddd0f2"><tspan fill="#ff2a6d">▸ </tspan>Kafka → Spark Structured Streaming → Delta Lake on S3.</text><text x="28" y="274" class="mono" font-size="11" letter-spacing="3" fill="#b8a6cf">ROADMAP</text><line x1="44" y1="304" x2="546" y2="304" stroke="#4a3a62" stroke-width="2"/><line x1="44" y1="304" x2="211" y2="304" stroke="#ff2a6d" stroke-width="3" filter="url(#g)" stroke-dasharray="167" stroke-dashoffset="167"><animate attributeName="stroke-dashoffset" from="167" to="0" dur="1.6s" begin=".3s" fill="freeze"/></line><circle cx="44" cy="304" r="8" fill="#ff2a6d" filter="url(#g)"/><path d="M40,304 l3,3 l5,-6" stroke="#0a0612" stroke-width="2" fill="none"/><text x="36" y="334" text-anchor="start" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#ff2a6d">TOPIC DESIGN</text><circle cx="211" cy="304" r="14" fill="none" stroke="#ffc06b" stroke-opacity=".6"><animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/></circle><circle cx="211" cy="304" r="8" fill="#0a0612" stroke="#ffc06b" stroke-width="2.5"/><text x="211" y="334" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#ffc06b">ANOMALY STREAM</text><circle cx="379" cy="304" r="7" fill="#0a0612" stroke="#6b5a85" stroke-width="2" stroke-dasharray="3 3"/><text x="379" y="334" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#8a7aa3">DELTA SINK</text><circle cx="546" cy="304" r="7" fill="#0a0612" stroke="#6b5a85" stroke-width="2" stroke-dasharray="3 3"/><text x="554" y="334" text-anchor="end" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#8a7aa3">CHAOS TESTS</text><rect x="28" y="370" width="70" height="22" rx="4" fill="#ffffff" fill-opacity=".04" stroke="#d6c6f2" stroke-opacity=".35"/><text x="37" y="385" class="mono" font-size="12" fill="#d6c6f2">Kafka 4</text><rect x="106" y="370" width="85" height="22" rx="4" fill="#ffffff" fill-opacity=".04" stroke="#d6c6f2" stroke-opacity=".35"/><text x="115" y="385" class="mono" font-size="12" fill="#d6c6f2">Spark 3.5</text><rect x="198" y="370" width="92" height="22" rx="4" fill="#ffffff" fill-opacity=".04" stroke="#d6c6f2" stroke-opacity=".35"/><text x="207" y="385" class="mono" font-size="12" fill="#d6c6f2">Delta Lake</text><rect x="298" y="370" width="62" height="22" rx="4" fill="#ffffff" fill-opacity=".04" stroke="#d6c6f2" stroke-opacity=".35"/><text x="307" y="385" class="mono" font-size="12" fill="#d6c6f2">DuckDB</text><rect x="369" y="370" width="62" height="22" rx="4" fill="#ffffff" fill-opacity=".04" stroke="#d6c6f2" stroke-opacity=".35"/><text x="378" y="385" class="mono" font-size="12" fill="#d6c6f2">Docker</text><text x="564" y="386" text-anchor="end" class="mono" font-size="10" fill="#7d6c99">group project</text><rect width="590" height="420" fill="url(#scan)"/></svg>