<svg xmlns="http://www.w3.org/2000/svg" width="590" height="420" viewBox="0 0 590 420" role="img" aria-label="Real-Time IoT Anomaly Pipeline — Streaming analytics for a 200-sensor network"><title>Real-Time IoT Anomaly Pipeline — Streaming analytics for a 200-sensor network</title><style>
.sans{font-family:'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Courier New',monospace} .jp{font-family:'Yu Gothic','Hiragino Sans','Noto Sans CJK JP','Meiryo',sans-serif}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes run{to{stroke-dashoffset:-1000}}
@keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(620px)}}
@keyframes drift{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(520px)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140b22"/><stop offset="1" stop-color="#08040e"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff2a6d"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".25"/></pattern></defs>
