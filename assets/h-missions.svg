<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="MAIN MISSIONS"><title>MAIN MISSIONS</title><style>
.sans{font-family:'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Courier New',monospace} .jp{font-family:'Yu Gothic','Hiragino Sans','Noto Sans CJK JP','Meiryo',sans-serif}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes run{to{stroke-dashoffset:-1000}}
@keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(620px)}}
@keyframes drift{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(520px)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="432" x2="1110" y1="0" y2="0"><stop offset="0" stop-color="#ff2a6d"/><stop offset=".5" stop-color="#ff8a3d" stop-opacity=".6"/>
<stop offset="1" stop-color="#5ef2ff" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="16" width="5" height="38" fill="#ff2a6d" filter="url(#g)" style="animation:pulse 2.4s ease-in-out infinite"/>
<text x="22" y="47" class="sans" font-size="28" font-weight="800" letter-spacing="7" fill="#f3e9ff" filter="url(#g)"
 style="animation:flicker 9s linear -13s infinite">MAIN MISSIONS</text>
<text x="362" y="47" class="mono" font-size="13" letter-spacing="3" fill="#ff8a3d">// 01</text>
<line x1="432" y1="37" x2="1110" y2="37" stroke="url(#ln)" stroke-width="1.5"/>
<circle r="3" cy="37" fill="#5ef2ff" filter="url(#g)"><animate attributeName="cx" values="432;1110" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
<text x="1198" y="45" text-anchor="end" class="jp" font-size="20" font-weight="700" fill="#ff2a6d" opacity=".75">任務</text></svg>